<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Dish | Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Quicksand', sans-serif; background-color: #F8F7F2; }
    .font-serif { font-family: 'Playfair Display', serif; }
    #intro { position:fixed;inset:0;background:#f5f5f0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50; }
    .floating { position:absolute;border-radius:50%;opacity:0.15;filter:blur(6px) grayscale(80%);animation:float 20s ease-in-out infinite; }
    @keyframes float{0%{transform:translate(0,0)}25%{transform:translate(15px,20px)}50%{transform:translate(0,0)}75%{transform:translate(-15px,-20px)}100%{transform:translate(0,0)}}
    #intro-logo{display:flex;align-items:center;gap:15px;font-size:2.5rem;font-weight:bold;color:#5d866c;opacity:0;transform:scale(0.9);animation:fadeInScale 1.8s ease forwards}
    @keyframes fadeInScale{to{opacity:1;transform:scale(1)}}
    #intro-tagline{font-size:1.2rem;color:#c2a68c;margin-top:10px;opacity:0;animation:fadeIn 2s ease 1.5s forwards}
    @keyframes fadeIn{to{opacity:1}}
    #intro-loader{margin-top:40px;width:40px;height:40px;border:4px solid #e6d8c3;border-top:4px solid #5d866c;border-radius:50%;animation:spin 2s linear infinite}
    @keyframes spin{100%{transform:rotate(360deg)}}
    .icon1{top:10%;left:10%;width:80px;height:80px}
    .icon2{top:20%;right:10%;width:90px;height:90px}
    .icon3{bottom:15%;left:15%;width:70px;height:70px}
    .icon4{bottom:10%;right:5%;width:80px;height:80px}
  </style>
</head>
<body class="text-stone-800 flex flex-col min-h-screen">

<div id="intro">
  <div class="floating icon1" style="background:#10b981"></div>
  <div class="floating icon2" style="background:#f59e0b"></div>
  <div class="floating icon3" style="background:#ef4444"></div>
  <div class="floating icon4" style="background:#6366f1"></div>
  <div id="intro-logo">
    <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="#5d866c"><path d="M22,9.333V8H2V9.333a9.998,9.998,0,0,0,2.158,6.334L4,22H20l-.158-6.333A9.998,9.998,0,0,0,22,9.333ZM12,2a8,8,0,0,0-8,8v.667h16V10A8,8,0,0,0,12,2Z"/></svg>
    Daily Dish
  </div>
  <div id="intro-tagline">Fresh meals. Fresh deals.</div>
  <div id="intro-loader"></div>
</div>

<header class="bg-white/80 backdrop-blur-lg shadow-sm sticky top-0 z-40">
  <div class="container mx-auto px-6 py-4 flex justify-between items-center">
    <a href="/" class="text-2xl font-bold text-emerald-600 flex items-center gap-3">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-emerald-500" viewBox="0 0 24 24" fill="currentColor"><path d="M22,9.333V8H2V9.333a9.998,9.998,0,0,0,2.158,6.334L4,22H20l-.158-6.333A9.998,9.998,0,0,0,22,9.333ZM12,2a8,8,0,0,0-8,8v.667h16V10A8,8,0,0,0,12,2Z"/></svg>
      <span class="font-serif">Daily Dish</span>
    </a>
  </div>
</header>

<main class="flex-grow flex items-center justify-center py-12">
  <div class="w-full max-w-md bg-white p-8 md:p-10 rounded-2xl shadow-2xl border border-stone-200 opacity-0 transition-opacity duration-1000" id="loginCard">
    <h2 class="text-4xl font-serif font-bold text-stone-800 mb-2 text-center">Welcome Back</h2>
    <p class="text-stone-500 mb-8 text-center">Login to DailyDish and enjoy your meal!</p>

    <div id="error-msg" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-600 text-sm"></div>

    <form id="login-form" class="space-y-6">
      <div>
        <label for="email" class="block text-sm font-bold mb-2 text-stone-700">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com"
               class="w-full p-4 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none transition" required>
      </div>
      <div>
        <label for="password" class="block text-sm font-bold mb-2 text-stone-700">Password</label>
        <input type="password" id="password" placeholder="••••••••"
               class="w-full p-4 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none transition" required>
      </div>
      <button type="submit" id="submit-btn"
              class="w-full bg-emerald-500 text-white font-bold py-4 px-6 rounded-lg hover:bg-emerald-600 focus:outline-none focus:ring-4 focus:ring-emerald-300 transition-all duration-300 shadow-lg">
        Log In
      </button>
    </form>

    <p class="mt-8 text-center text-stone-600">
      Don't have an account?
      <a href="/signup.html" class="text-emerald-600 hover:text-emerald-700 font-bold">Sign Up</a>
    </p>
  </div>
</main>

<footer class="text-center py-4 text-stone-500 text-sm bg-white border-t border-stone-200">
  © 2025 Daily Dish.
</footer>

<script src="/api.js"></script>
<script>
  // Redirect if already logged in
  redirectIfLoggedIn();

  // Intro animation
  const intro = document.getElementById('intro');
  const loginCard = document.getElementById('loginCard');
  function endIntro() {
    intro.style.transition = 'opacity 0.8s';
    intro.style.opacity = 0;
    setTimeout(() => { intro.style.display = 'none'; loginCard.style.opacity = 1; }, 800);
  }
  setTimeout(endIntro, 2800);
  intro.addEventListener('click', endIntro);

  // Form handler
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const errEl = document.getElementById('error-msg');
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    btn.disabled = true;
    btn.textContent = 'Logging in…';
    errEl.classList.add('hidden');

    try {
      const data = await apiFetch('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email, password })
      });
      setToken(data.token);
      setUser(data.user);
      showToast('Welcome back, ' + data.user.name + '! 🎉');
      setTimeout(() => {
        window.location.href = data.user.role === 'seller' ? '/seller_dashboard.html' : '/buyer_dashboard.html';
      }, 600);
    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = 'Log In';
    }
  });
</script>
</body>
</html>
