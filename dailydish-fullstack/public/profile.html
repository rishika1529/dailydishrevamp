<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Dish | Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>body{font-family:'Quicksand',sans-serif;background-color:#F8F7F2}.font-serif{font-family:'Playfair Display',serif}</style>
</head>
<body class="text-stone-800 flex flex-col min-h-screen">
<header class="bg-white/90 backdrop-blur-lg shadow-sm sticky top-0 z-50 border-b border-emerald-100">
  <div class="container mx-auto px-6 py-4 flex justify-between items-center">
    <a href="/" class="text-2xl font-bold text-emerald-600 flex items-center gap-3">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-emerald-500" viewBox="0 0 24 24" fill="currentColor"><path d="M22,9.333V8H2V9.333a9.998,9.998,0,0,0,2.158,6.334L4,22H20l-.158-6.333A9.998,9.998,0,0,0,22,9.333ZM12,2a8,8,0,0,0-8,8v.667h16V10A8,8,0,0,0,12,2Z"/></svg>
      <span class="font-serif">Daily Dish</span>
    </a>
    <div class="flex items-center gap-4">
      <a id="dash-link" href="/" class="text-emerald-600 font-semibold hover:underline text-sm">← Dashboard</a>
      <button data-logout-btn class="px-4 py-2 text-sm text-white bg-red-500 rounded-full hover:bg-red-600 transition">Logout</button>
    </div>
  </div>
</header>

<main class="flex-grow py-10">
  <div class="container mx-auto px-6 max-w-2xl">
    <h1 class="text-4xl font-serif font-bold mb-8">Your Profile</h1>

    <!-- Avatar & Summary -->
    <div class="bg-white p-8 rounded-2xl shadow-lg mb-8 flex items-center gap-6">
      <div class="h-20 w-20 rounded-full bg-emerald-500 flex items-center justify-center text-white text-3xl font-bold" id="avatar-circle">?</div>
      <div>
        <h2 class="text-2xl font-bold" id="profile-name">—</h2>
        <p class="text-stone-500" id="profile-email">—</p>
        <span id="role-badge" class="inline-block mt-2 px-3 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-700">—</span>
      </div>
    </div>

    <div id="success-msg" class="hidden mb-4 p-3 bg-emerald-50 border border-emerald-200 rounded-lg text-emerald-700 text-sm font-semibold"></div>
    <div id="error-msg" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-600 text-sm"></div>

    <!-- Edit Form -->
    <div class="bg-white p-8 rounded-2xl shadow-lg mb-8">
      <h2 class="text-xl font-serif font-bold mb-5">Edit Details</h2>
      <form id="profile-form" class="space-y-5">
        <div>
          <label class="block text-sm font-bold mb-2 text-stone-700">Full Name</label>
          <input type="text" id="edit-name" class="w-full p-4 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" required>
        </div>
        <div id="shop-fields" class="hidden space-y-4">
          <div>
            <label class="block text-sm font-bold mb-2 text-stone-700">Shop Name</label>
            <input type="text" id="edit-shopName" class="w-full p-4 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-bold mb-2 text-stone-700">Shop Address</label>
            <input type="text" id="edit-shopAddress" class="w-full p-4 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>
        </div>
        <button type="submit" id="save-btn"
                class="w-full bg-emerald-500 text-white font-bold py-4 rounded-lg hover:bg-emerald-600 transition shadow-lg">
          Save Changes
        </button>
      </form>
    </div>

    <!-- Change Password -->
    <div class="bg-white p-8 rounded-2xl shadow-lg">
      <h2 class="text-xl font-serif font-bold mb-5">Change Password</h2>
      <form id="password-form" class="space-y-4">
        <div>
          <label class="block text-sm font-bold mb-2 text-stone-700">New Password</label>
          <input type="password" id="new-password" placeholder="Min 6 characters" class="w-full p-4 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" required>
        </div>
        <div>
          <label class="block text-sm font-bold mb-2 text-stone-700">Confirm New Password</label>
          <input type="password" id="confirm-password" placeholder="Repeat password" class="w-full p-4 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" required>
        </div>
        <button type="submit" id="pw-btn"
                class="w-full border-2 border-emerald-500 text-emerald-600 font-bold py-4 rounded-lg hover:bg-emerald-50 transition">
          Update Password
        </button>
      </form>
    </div>
  </div>
</main>
<footer class="text-center py-4 text-stone-500 text-sm bg-white border-t border-stone-200">© 2025 Daily Dish.</footer>
<script src="/api.js"></script>
<script>
  if (!requireAuth()) {}
  const user = getUser();

  // Setup
  document.getElementById('dash-link').href = isRole('seller') ? '/seller_dashboard.html' : '/buyer_dashboard.html';
  document.getElementById('avatar-circle').textContent = (user?.name || '?')[0].toUpperCase();
  document.getElementById('profile-name').textContent = user?.name || '—';
  document.getElementById('profile-email').textContent = user?.email || '—';
  document.getElementById('role-badge').textContent = user?.role === 'seller' ? '🏪 Seller' : '🛍️ Buyer';
  document.getElementById('edit-name').value = user?.name || '';
  if (user?.role === 'seller') {
    document.getElementById('shop-fields').classList.remove('hidden');
    document.getElementById('edit-shopName').value = user?.shopName || '';
    document.getElementById('edit-shopAddress').value = user?.shopAddress || '';
  }

  function showMsg(msg, isError = false) {
    const el = document.getElementById(isError ? 'error-msg' : 'success-msg');
    const other = document.getElementById(isError ? 'success-msg' : 'error-msg');
    other.classList.add('hidden');
    el.textContent = msg;
    el.classList.remove('hidden');
    setTimeout(() => el.classList.add('hidden'), 3000);
  }

  document.getElementById('profile-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('save-btn');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const body = { name: document.getElementById('edit-name').value.trim() };
      if (user?.role === 'seller') {
        body.shopName = document.getElementById('edit-shopName').value.trim();
        body.shopAddress = document.getElementById('edit-shopAddress').value.trim();
      }
      const data = await apiFetch('/auth/me/update', { method: 'PATCH', body: JSON.stringify(body) });
      setUser({ ...user, ...body });
      showMsg('Profile updated successfully!');
      document.getElementById('profile-name').textContent = body.name;
      document.getElementById('avatar-circle').textContent = body.name[0].toUpperCase();
    } catch (err) { showMsg(err.message, true); }
    finally { btn.disabled = false; btn.textContent = 'Save Changes'; }
  });

  document.getElementById('password-form').addEventListener('submit', async e => {
    e.preventDefault();
    const np = document.getElementById('new-password').value;
    const cp = document.getElementById('confirm-password').value;
    if (np !== cp) { showMsg('Passwords do not match.', true); return; }
    if (np.length < 6) { showMsg('Password must be at least 6 characters.', true); return; }
    const btn = document.getElementById('pw-btn');
    btn.disabled = true; btn.textContent = 'Updating…';
    try {
      await apiFetch('/auth/me/password', { method: 'PATCH', body: JSON.stringify({ password: np }) });
      showMsg('Password updated! Please log in again.');
      setTimeout(logout, 1800);
    } catch (err) { showMsg(err.message, true); }
    finally { btn.disabled = false; btn.textContent = 'Update Password'; }
  });
</script>
</body>
</html>
