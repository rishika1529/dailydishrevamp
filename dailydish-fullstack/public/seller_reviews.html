<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Dish | Your Reviews</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>body{font-family:'Quicksand',sans-serif;background-color:#F8F7F2}.font-serif{font-family:'Playfair Display',serif}</style>
</head>
<body class="text-stone-800 flex flex-col min-h-screen">
<header class="bg-white/90 backdrop-blur-lg shadow-sm sticky top-0 z-50 border-b border-emerald-100">
  <div class="container mx-auto px-6 py-4 flex justify-between items-center">
    <a href="/" class="text-2xl font-bold text-emerald-600 flex items-center gap-3">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-emerald-500" viewBox="0 0 24 24" fill="currentColor"><path d="M22,9.333V8H2V9.333a9.998,9.998,0,0,0,2.158,6.334L4,22H20l-.158-6.333A9.998,9.998,0,0,0,22,9.333ZM12,2a8,8,0,0,0-8,8v.667h16V10A8,8,0,0,0,12,2Z"/></svg>
      <span class="font-serif">Daily Dish</span>
    </a>
    <nav class="hidden md:flex items-center gap-8">
      <a href="/seller_dashboard.html" class="text-stone-600 hover:text-emerald-600">Dashboard</a>
      <a href="/seller_selling_history.html" class="text-stone-600 hover:text-emerald-600">Orders</a>
      <a href="/seller_reviews.html" class="text-emerald-600 font-semibold">Reviews</a>
    </nav>
    <div class="flex items-center gap-4">
      <span class="text-sm text-stone-500">Hi, <strong data-user-name></strong></span>
      <button data-logout-btn class="px-4 py-2 text-sm text-white bg-red-500 rounded-full hover:bg-red-600 transition">Logout</button>
    </div>
  </div>
</header>

<main class="flex-grow py-10">
  <div class="container mx-auto px-6 max-w-3xl">
    <h1 class="text-4xl font-serif font-bold mb-4">Your Reviews</h1>
    <div class="flex items-center gap-4 mb-8">
      <div class="text-5xl font-bold text-emerald-600" id="avg-rating">—</div>
      <div>
        <p class="font-semibold text-stone-700">Average rating</p>
        <p class="text-sm text-stone-400" id="total-reviews-count">0 reviews</p>
      </div>
    </div>
    <div id="reviews-list" class="space-y-4">
      <p class="text-stone-400 text-center py-8">Loading…</p>
    </div>
  </div>
</main>
<footer class="text-center py-4 text-stone-500 text-sm bg-white border-t border-stone-200">© 2025 Daily Dish.</footer>
<script src="/api.js"></script>
<script>
  if (!requireAuth('seller')) {}
  const user = getUser();
  apiFetch(`/reviews?sellerId=${user.id}`).then(data => {
    const reviews = data.reviews || [];
    document.getElementById('total-reviews-count').textContent = `${reviews.length} review${reviews.length !== 1 ? 's' : ''}`;
    if (reviews.length) {
      const avg = reviews.reduce((s, r) => s + r.rating, 0) / reviews.length;
      document.getElementById('avg-rating').textContent = avg.toFixed(1) + ' ⭐';
    }
    const el = document.getElementById('reviews-list');
    if (!reviews.length) { el.innerHTML = '<p class="text-stone-400 text-center py-8">No reviews yet. Keep serving great food!</p>'; return; }
    el.innerHTML = reviews.map(r => `
      <div class="bg-white p-6 rounded-xl shadow border border-stone-100">
        <div class="flex justify-between items-start mb-3">
          <div>
            <p class="font-bold">${r.authorName || r.author?.name || 'Customer'}</p>
          </div>
          <div class="text-right">
            <p class="text-xl">${'⭐'.repeat(r.rating)}</p>
            <p class="text-xs text-stone-400">${new Date(r.createdAt).toLocaleDateString()}</p>
          </div>
        </div>
        <p class="text-stone-700">${r.text}</p>
      </div>`).join('');
  }).catch(() => {});
</script>
</body>
</html>
