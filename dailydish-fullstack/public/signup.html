<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Dish | Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Quicksand', sans-serif; background-color: #F8F7F2; }
    .font-serif { font-family: 'Playfair Display', serif; }
    #intro { position:fixed;inset:0;background:#f5f5f0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50; }
    .floating { position:absolute;border-radius:50%;opacity:0.15;filter:blur(6px) grayscale(80%);animation:float 20s ease-in-out infinite; }
    @keyframes float{0%{transform:translate(0,0)}25%{transform:translate(15px,20px)}50%{transform:translate(0,0)}75%{transform:translate(-15px,-20px)}100%{transform:translate(0,0)}}
    #intro-logo{display:flex;align-items:center;gap:15px;font-size:2.5rem;font-weight:bold;color:#5d866c;opacity:0;transform:scale(0.9);animation:fadeInScale 1.8s ease forwards}
    @keyframes fadeInScale{to{opacity:1;transform:scale(1)}}
    #intro-tagline{font-size:1.2rem;color:#c2a68c;margin-top:10px;opacity:0;animation:fadeIn 2s ease 1.5s forwards}
    @keyframes fadeIn{to{opacity:1}}
    #intro-loader{margin-top:40px;width:40px;height:40px;border:4px solid #e6d8c3;border-top:4px solid #5d866c;border-radius:50%;animation:spin 2s linear infinite}
    @keyframes spin{100%{transform:rotate(360deg)}}
    .icon1{top:10%;left:10%;width:80px;height:80px}
    .icon2{top:20%;right:10%;width:90px;height:90px}
    .icon3{bottom:15%;left:15%;width:70px;height:70px}
    .icon4{bottom:10%;right:5%;width:80px;height:80px}
    #signupCard { opacity:0;transition:opacity 1s ease; }
  </style>
</head>
<body class="text-stone-800 flex flex-col min-h-screen">

<!-- Notification Modal -->
<div id="notification-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-75 flex items-center justify-center z-[100]">
  <div class="bg-white p-6 rounded-lg shadow-2xl max-w-sm w-full">
    <h3 id="notification-title" class="text-xl font-bold mb-3 text-stone-800"></h3>
    <p id="notification-message" class="text-stone-600 mb-4"></p>
    <div class="flex justify-end">
      <button id="notification-close" class="bg-emerald-500 text-white font-semibold py-2 px-4 rounded-lg hover:bg-emerald-600 transition">OK</button>
    </div>
  </div>
</div>

<div id="intro">
  <div class="floating icon1" style="background:#10b981"></div>
  <div class="floating icon2" style="background:#f59e0b"></div>
  <div class="floating icon3" style="background:#ef4444"></div>
  <div class="floating icon4" style="background:#6366f1"></div>
  <div id="intro-logo">
    <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="#5d866c"><path d="M22,9.333V8H2V9.333a9.998,9.998,0,0,0,2.158,6.334L4,22H20l-.158-6.333A9.998,9.998,0,0,0,22,9.333ZM12,2a8,8,0,0,0-8,8v.667h16V10A8,8,0,0,0,12,2Z"/></svg>
    Daily Dish
  </div>
  <div id="intro-tagline">Fresh meals. Fresh deals.</div>
  <div id="intro-loader"></div>
</div>

<header class="bg-white/80 backdrop-blur-lg shadow-sm sticky top-0 z-40">
  <div class="container mx-auto px-6 py-4 flex justify-between items-center">
    <a href="/" class="text-2xl font-bold text-emerald-600 flex items-center gap-3">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-emerald-500" viewBox="0 0 24 24" fill="currentColor"><path d="M22,9.333V8H2V9.333a9.998,9.998,0,0,0,2.158,6.334L4,22H20l-.158-6.333A9.998,9.998,0,0,0,22,9.333ZM12,2a8,8,0,0,0-8,8v.667h16V10A8,8,0,0,0,12,2Z"/></svg>
      <span class="font-serif">Daily Dish</span>
    </a>
  </div>
</header>

<main class="flex-grow flex items-center justify-center py-12">
  <div class="w-full max-w-md bg-white p-8 md:p-10 rounded-2xl shadow-2xl border border-stone-200" id="signupCard">
    <h2 class="text-4xl font-serif font-bold text-stone-800 mb-2 text-center">Create Account</h2>
    <p class="text-stone-500 mb-8 text-center">Join DailyDish and start saving!</p>

    <div id="error-msg" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-600 text-sm"></div>

    <form id="signup-form" class="space-y-5">
      <div>
        <label class="block text-sm font-bold mb-2 text-stone-700">Full Name</label>
        <input type="text" id="name" placeholder="Your Name"
               class="w-full p-4 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none transition" required>
      </div>
      <div>
        <label class="block text-sm font-bold mb-2 text-stone-700">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com"
               class="w-full p-4 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none transition" required>
      </div>
      <div>
        <label class="block text-sm font-bold mb-2 text-stone-700">Password</label>
        <input type="password" id="password" placeholder="Min 6 characters"
               class="w-full p-4 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none transition" required>
      </div>
      <div>
        <label class="block text-sm font-bold mb-2 text-stone-700">I am a…</label>
        <select id="role" class="w-full p-4 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
          <option value="buyer">Buyer – I want to find deals</option>
          <option value="seller">Seller – I want to post deals</option>
        </select>
      </div>
      <div id="seller-fields" class="hidden space-y-4">
        <div>
          <label class="block text-sm font-bold mb-2 text-stone-700">Shop Name</label>
          <input type="text" id="shopName" placeholder="e.g. Corner Bakery"
                 class="w-full p-4 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
        </div>
        <div>
          <label class="block text-sm font-bold mb-2 text-stone-700">Shop Address</label>
          <input type="text" id="shopAddress" placeholder="e.g. 12 Main St, Downtown"
                 class="w-full p-4 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
        </div>
      </div>

      <button type="submit" id="signup-button"
              class="w-full bg-emerald-500 text-white font-bold py-4 px-6 rounded-lg hover:bg-emerald-600 focus:outline-none focus:ring-4 focus:ring-emerald-300 transition-all duration-300 shadow-lg">
        Sign Up
      </button>
    </form>

    <p class="mt-8 text-center text-stone-600">
      Already have an account?
      <a href="/login.html" class="text-emerald-600 hover:text-emerald-700 font-bold">Log In</a>
    </p>
  </div>
</main>

<footer class="text-center py-4 text-stone-500 text-sm bg-white border-t border-stone-200">
  © 2025 Daily Dish.
</footer>

<script src="/api.js"></script>
<script>
  redirectIfLoggedIn();

  document.getElementById('notification-close').addEventListener('click', () => {
    document.getElementById('notification-modal').classList.add('hidden');
  });

  // Intro video
  const intro = document.getElementById('intro');
  const signupCard = document.getElementById('signupCard');
  const video = document.getElementById('intro-video');
  function endIntro() {
    intro.style.opacity = 0;
    setTimeout(() => { intro.style.display = 'none'; signupCard.style.opacity = 1; }, 800);
  }
  video.addEventListener('ended', endIntro);
  video.addEventListener('error', () => setTimeout(endIntro, 2000));
  video.play().catch(() => setTimeout(endIntro, 2000));
  intro.addEventListener('click', endIntro);

  // Show/hide seller fields
  document.getElementById('role').addEventListener('change', function () {
    document.getElementById('seller-fields').classList.toggle('hidden', this.value !== 'seller');
  });

  // Signup
  document.getElementById('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('signup-button');
    const errEl = document.getElementById('error-msg');
    const role = document.getElementById('role').value;

    btn.disabled = true;
    btn.textContent = 'Creating Account…';
    errEl.classList.add('hidden');

    try {
      const body = {
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        role,
        shopName: document.getElementById('shopName')?.value.trim(),
        shopAddress: document.getElementById('shopAddress')?.value.trim()
      };

      const data = await apiFetch('/auth/signup', { method: 'POST', body: JSON.stringify(body) });
      setToken(data.token);
      setUser(data.user);
      showToast('Welcome to Daily Dish, ' + data.user.name + '! 🎉');
      setTimeout(() => {
        window.location.href = role === 'seller' ? '/seller_dashboard.html' : '/buyer_dashboard.html';
      }, 800);
    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = 'Sign Up';
    }
  });
</script>
</body>
</html>
