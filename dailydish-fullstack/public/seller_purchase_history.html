<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Dish | My Purchases</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>body{font-family:'Quicksand',sans-serif;background-color:#F8F7F2}.font-serif{font-family:'Playfair Display',serif}</style>
</head>
<body class="text-stone-800 flex flex-col min-h-screen">
<header class="bg-white/90 backdrop-blur-lg shadow-sm sticky top-0 z-50 border-b border-emerald-100">
  <div class="container mx-auto px-6 py-4 flex justify-between items-center">
    <a href="/" class="text-2xl font-bold text-emerald-600 flex items-center gap-3">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-emerald-500" viewBox="0 0 24 24" fill="currentColor"><path d="M22,9.333V8H2V9.333a9.998,9.998,0,0,0,2.158,6.334L4,22H20l-.158-6.333A9.998,9.998,0,0,0,22,9.333ZM12,2a8,8,0,0,0-8,8v.667h16V10A8,8,0,0,0,12,2Z"/></svg>
      <span class="font-serif">Daily Dish</span>
    </a>
    <nav class="hidden md:flex items-center gap-8">
      <a href="/seller_dashboard.html" class="text-stone-600 hover:text-emerald-600">Dashboard</a>
      <a href="/seller_selling_history.html" class="text-stone-600 hover:text-emerald-600">Orders</a>
      <a href="/seller_purchase_history.html" class="text-emerald-600 font-semibold">Purchases</a>
      <a href="/seller_reviews.html" class="text-stone-600 hover:text-emerald-600">Reviews</a>
    </nav>
    <div class="flex items-center gap-4">
      <span class="text-sm text-stone-500">Hi, <strong data-user-name></strong></span>
      <button data-logout-btn class="px-4 py-2 text-sm text-white bg-red-500 rounded-full hover:bg-red-600 transition">Logout</button>
    </div>
  </div>
</header>

<main class="flex-grow py-10">
  <div class="container mx-auto px-6">
    <div class="flex items-center justify-between mb-8">
      <h1 class="text-4xl font-serif font-bold">Your Purchase History</h1>
      <a href="/seller_dashboard.html" class="px-5 py-2 bg-emerald-500 text-white font-bold rounded-lg hover:bg-emerald-600 text-sm">← Dashboard</a>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
      <div class="bg-white p-8 rounded-2xl shadow-lg border-b-4 border-blue-400">
        <p class="text-stone-500 font-semibold mb-2">🛒 Total Purchases</p>
        <div class="text-4xl font-bold text-blue-600" id="total-orders">—</div>
        <p class="text-sm text-stone-400 mt-2">all time</p>
      </div>
      <div class="bg-white p-8 rounded-2xl shadow-lg border-b-4 border-amber-400">
        <p class="text-stone-500 font-semibold mb-2">💸 Total Spent</p>
        <div class="text-4xl font-bold text-amber-600" id="total-paid">₹0</div>
        <p class="text-sm text-stone-400 mt-2">on deals</p>
      </div>
      <div class="bg-white p-8 rounded-2xl shadow-lg border-b-4 border-green-400">
        <p class="text-stone-500 font-semibold mb-2">💰 Total Saved</p>
        <div class="text-4xl font-bold text-green-600" id="total-saved">₹0</div>
        <p class="text-sm text-stone-400 mt-2">vs retail price</p>
      </div>
    </div>

    <!-- Table -->
    <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead class="bg-stone-50 text-left text-xs font-bold text-stone-500 uppercase tracking-wide">
            <tr>
              <th class="px-6 py-4">Item</th>
              <th class="px-6 py-4">Shop</th>
              <th class="px-6 py-4">Paid</th>
              <th class="px-6 py-4">Original</th>
              <th class="px-6 py-4">Saved</th>
              <th class="px-6 py-4">Qty</th>
              <th class="px-6 py-4">Status</th>
              <th class="px-6 py-4">Pickup Code</th>
              <th class="px-6 py-4">Date</th>
            </tr>
          </thead>
          <tbody id="purchase-table" class="divide-y divide-stone-100">
            <tr><td colspan="9" class="px-6 py-8 text-center text-stone-400">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>
<footer class="text-center py-4 text-stone-500 text-sm bg-white border-t border-stone-200">© 2025 Daily Dish.</footer>
<script src="/api.js"></script>
<script>
  if (!requireAuth('seller')) {}

  const statusColors = {
    reserved: 'bg-blue-100 text-blue-700',
    sold: 'bg-emerald-100 text-emerald-700',
    cancelled: 'bg-red-100 text-red-600'
  };

  apiFetch('/orders/my').then(data => {
    const orders = data.orders || [];
    const active = orders.filter(o => o.status !== 'cancelled');

    document.getElementById('total-orders').textContent = active.length;
    const paid = active.reduce((s, o) => s + o.totalPaid, 0);
    const orig = active.reduce((s, o) => s + o.totalOriginal, 0);
    document.getElementById('total-paid').textContent = `₹${Math.round(paid)}`;
    document.getElementById('total-saved').textContent = `₹${Math.round(orig - paid)}`;

    const tbody = document.getElementById('purchase-table');
    if (!orders.length) {
      tbody.innerHTML = '<tr><td colspan="9" class="px-6 py-8 text-center text-stone-400">No purchases yet. Browse deals from other shops!</td></tr>';
      return;
    }
    tbody.innerHTML = orders.map(o => `
      <tr class="hover:bg-stone-50">
        <td class="px-6 py-4 font-semibold">${o.dealSnapshot.name}</td>
        <td class="px-6 py-4 text-stone-500">${o.dealSnapshot.shopName}</td>
        <td class="px-6 py-4 text-emerald-600 font-bold">₹${o.totalPaid}</td>
        <td class="px-6 py-4 text-stone-400 line-through">₹${o.totalOriginal}</td>
        <td class="px-6 py-4 text-green-600 font-semibold">₹${o.totalOriginal - o.totalPaid}</td>
        <td class="px-6 py-4">${o.quantity}</td>
        <td class="px-6 py-4">
          <span class="px-2 py-1 rounded-full text-xs font-bold ${statusColors[o.status]}">${o.status.replace('_', ' ')}</span>
        </td>
        <td class="px-6 py-4 font-mono text-sm text-emerald-600">${(o.status === 'reserved' || o.status === 'sold') && o.buyerConfirmed ? o.pickupCode : o.status === 'reserved' ? 'Confirming…' : '—'}</td>
        <td class="px-6 py-4 text-xs text-stone-400">${new Date(o.createdAt).toLocaleDateString()}</td>
      </tr>`).join('');
  }).catch(() => {
    document.getElementById('purchase-table').innerHTML =
      '<tr><td colspan="9" class="px-6 py-8 text-center text-red-400">Failed to load purchases.</td></tr>';
  });
</script>
</body>
</html>
