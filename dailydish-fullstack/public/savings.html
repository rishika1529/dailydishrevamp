<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Dish | Your Savings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>body{font-family:'Quicksand',sans-serif;background-color:#F8F7F2}.font-serif{font-family:'Playfair Display',serif}</style>
</head>
<body class="text-stone-800 flex flex-col min-h-screen">
<header class="bg-white/90 backdrop-blur-lg shadow-sm sticky top-0 z-50 border-b border-emerald-100">
  <div class="container mx-auto px-6 py-4 flex justify-between items-center">
    <a href="/" class="text-2xl font-bold text-emerald-600 flex items-center gap-3">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-emerald-500" viewBox="0 0 24 24" fill="currentColor"><path d="M22,9.333V8H2V9.333a9.998,9.998,0,0,0,2.158,6.334L4,22H20l-.158-6.333A9.998,9.998,0,0,0,22,9.333ZM12,2a8,8,0,0,0-8,8v.667h16V10A8,8,0,0,0,12,2Z"/></svg>
      <span class="font-serif">Daily Dish</span>
    </a>
    <nav class="hidden md:flex items-center gap-8">
      <a href="/buyer_dashboard.html" class="text-stone-600 hover:text-emerald-600">Deals</a>
      <a href="/savings.html" class="text-emerald-600 font-semibold">Savings</a>
      <a href="/purchase_history.html" class="text-stone-600 hover:text-emerald-600">History</a>
      <a href="/reviews.html" class="text-stone-600 hover:text-emerald-600">Reviews</a>
    </nav>
    <div class="flex items-center gap-4">
      <span class="text-sm text-stone-500">Hi, <strong data-user-name></strong></span>
      <button data-logout-btn class="px-4 py-2 text-sm text-white bg-red-500 rounded-full hover:bg-red-600 transition">Logout</button>
    </div>
  </div>
</header>

<main class="flex-grow py-10">
  <div class="container mx-auto px-6 max-w-4xl">
    <h1 class="text-4xl font-serif font-bold mb-8">Your Savings Summary</h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
      <div class="bg-gradient-to-br from-emerald-500 to-teal-600 text-white p-8 rounded-2xl shadow-xl">
        <p class="font-semibold opacity-80 mb-2">💰 Total Saved</p>
        <div class="text-5xl font-bold" id="total-savings">₹0</div>
        <p class="text-sm opacity-70 mt-2">vs original prices</p>
      </div>
      <div class="bg-white p-8 rounded-2xl shadow-lg border-b-4 border-amber-400">
        <p class="text-stone-500 font-semibold mb-2">🧾 Total Spent</p>
        <div class="text-4xl font-bold text-amber-600" id="total-paid">₹0</div>
        <p class="text-sm text-stone-400 mt-2">actual amount paid</p>
      </div>
      <div class="bg-white p-8 rounded-2xl shadow-lg border-b-4 border-blue-400">
        <p class="text-stone-500 font-semibold mb-2">🛍️ Total Orders</p>
        <div class="text-4xl font-bold text-blue-600" id="total-orders">0</div>
        <p class="text-sm text-stone-400 mt-2">successful pickups</p>
      </div>
    </div>

    <div class="bg-white p-8 rounded-2xl shadow-lg">
      <h2 class="text-2xl font-serif font-bold mb-6">Recent Purchases</h2>
      <div id="recent-purchases" class="space-y-4">
        <p class="text-stone-400 text-center py-8">Loading…</p>
      </div>
    </div>
  </div>
</main>
<footer class="text-center py-4 text-stone-500 text-sm bg-white border-t border-stone-200">© 2025 Daily Dish.</footer>
<script src="/api.js"></script>
<script>
  if (!requireAuth('buyer')) {}
  Promise.all([apiFetch('/orders/stats'), apiFetch('/orders/my')]).then(([statsData, ordersData]) => {
    const s = statsData.stats;
    document.getElementById('total-savings').textContent = `₹${Math.round(s.totalSavings)}`;
    document.getElementById('total-paid').textContent = `₹${Math.round(s.totalPaid)}`;
    document.getElementById('total-orders').textContent = s.totalOrders;

    const recent = (ordersData.orders || []).filter(o => o.status !== 'cancelled').slice(0, 8);
    const el = document.getElementById('recent-purchases');
    if (!recent.length) { el.innerHTML = '<p class="text-stone-400 text-center py-8">No purchases yet!</p>'; return; }
    el.innerHTML = recent.map(o => `
      <div class="flex items-center justify-between p-4 rounded-xl bg-stone-50 border border-stone-100">
        <div>
          <p class="font-semibold">${o.dealSnapshot.name}</p>
          <p class="text-sm text-stone-500">${o.dealSnapshot.shopName} • ${new Date(o.createdAt).toLocaleDateString()}</p>
        </div>
        <div class="text-right">
          <p class="text-emerald-600 font-bold">₹${o.totalPaid}</p>
          <p class="text-xs text-green-600">saved ₹${o.totalOriginal - o.totalPaid}</p>
        </div>
      </div>`).join('');
  }).catch(() => {});
</script>
</body>
</html>
