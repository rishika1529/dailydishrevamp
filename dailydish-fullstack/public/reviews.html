<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Dish | Reviews</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>body{font-family:'Quicksand',sans-serif;background-color:#F8F7F2}.font-serif{font-family:'Playfair Display',serif}</style>
</head>
<body class="text-stone-800 flex flex-col min-h-screen">
<header class="bg-white/90 backdrop-blur-lg shadow-sm sticky top-0 z-50 border-b border-emerald-100">
  <div class="container mx-auto px-6 py-4 flex justify-between items-center">
    <a href="/" class="text-2xl font-bold text-emerald-600 flex items-center gap-3">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-emerald-500" viewBox="0 0 24 24" fill="currentColor"><path d="M22,9.333V8H2V9.333a9.998,9.998,0,0,0,2.158,6.334L4,22H20l-.158-6.333A9.998,9.998,0,0,0,22,9.333ZM12,2a8,8,0,0,0-8,8v.667h16V10A8,8,0,0,0,12,2Z"/></svg>
      <span class="font-serif">Daily Dish</span>
    </a>
    <nav class="hidden md:flex items-center gap-8">
      <a href="/buyer_dashboard.html" class="text-stone-600 hover:text-emerald-600">Deals</a>
      <a href="/savings.html" class="text-stone-600 hover:text-emerald-600">Savings</a>
      <a href="/purchase_history.html" class="text-stone-600 hover:text-emerald-600">History</a>
      <a href="/reviews.html" class="text-emerald-600 font-semibold">Reviews</a>
    </nav>
    <div class="flex items-center gap-4">
      <span class="text-sm text-stone-500">Hi, <strong data-user-name></strong></span>
      <button data-logout-btn class="px-4 py-2 text-sm text-white bg-red-500 rounded-full hover:bg-red-600 transition">Logout</button>
    </div>
  </div>
</header>

<main class="flex-grow py-10">
  <div class="container mx-auto px-6 max-w-4xl">
    <h1 class="text-4xl font-serif font-bold mb-8">Community Reviews</h1>

    <!-- Post a Review -->
    <div class="bg-white p-8 rounded-2xl shadow-lg mb-10 border-l-4 border-emerald-400" id="review-form-section">
      <h2 class="text-2xl font-serif font-bold mb-5">Leave a Review</h2>
      <p class="text-stone-500 text-sm mb-4">You can review sellers you've ordered from. Select an order below.</p>
      <div id="form-error" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-600 text-sm"></div>
      <form id="review-form" class="space-y-4">
        <select id="order-select" class="w-full p-3 border border-stone-300 rounded-lg focus:ring-emerald-500 focus:border-emerald-500">
          <option value="">— Select an order to review —</option>
        </select>
        <div class="flex gap-2 items-center">
          <label class="font-bold text-sm text-stone-700">Rating:</label>
          <div class="flex gap-1" id="star-picker">
            <button type="button" data-v="1" class="text-2xl">☆</button>
            <button type="button" data-v="2" class="text-2xl">☆</button>
            <button type="button" data-v="3" class="text-2xl">☆</button>
            <button type="button" data-v="4" class="text-2xl">☆</button>
            <button type="button" data-v="5" class="text-2xl">☆</button>
          </div>
          <input type="hidden" id="rating-val" value="0">
        </div>
        <textarea id="review-text" placeholder="Share your experience…" rows="3"
                  class="w-full p-3 border border-stone-300 rounded-lg focus:ring-emerald-500 focus:border-emerald-500"></textarea>
        <button type="submit" class="px-6 py-3 bg-emerald-500 text-white font-bold rounded-lg hover:bg-emerald-600 transition">Submit Review</button>
      </form>
    </div>

    <!-- Reviews list -->
    <h2 class="text-2xl font-serif font-bold mb-5">All Reviews</h2>
    <div id="reviews-list" class="space-y-4">
      <p class="text-stone-400 text-center py-8">Loading reviews…</p>
    </div>
  </div>
</main>
<footer class="text-center py-4 text-stone-500 text-sm bg-white border-t border-stone-200">© 2025 Daily Dish.</footer>
<script src="/api.js"></script>
<script>
  if (!requireAuth('buyer')) {}
  let selectedRating = 0;

  // Star picker
  document.getElementById('star-picker').addEventListener('click', e => {
    const btn = e.target.closest('[data-v]');
    if (!btn) return;
    selectedRating = parseInt(btn.dataset.v);
    document.getElementById('rating-val').value = selectedRating;
    document.querySelectorAll('#star-picker button').forEach((b, i) => {
      b.textContent = i < selectedRating ? '⭐' : '☆';
    });
  });

  // Load eligible orders for review
  apiFetch('/orders/my').then(data => {
    const eligible = (data.orders || []).filter(o => o.status === 'sold' || o.status === 'reserved');
    const sel = document.getElementById('order-select');
    if (!eligible.length) {
      sel.innerHTML = '<option>No completed orders yet</option>';
      sel.disabled = true;
      return;
    }
    sel.innerHTML = '<option value="">— Select an order to review —</option>' +
      eligible.map(o => `<option value="${o._id}" data-seller="${o.seller}">${o.dealSnapshot.name} @ ${o.dealSnapshot.shopName}</option>`).join('');
  });

  // Submit review
  document.getElementById('review-form').addEventListener('submit', async e => {
    e.preventDefault();
    const errEl = document.getElementById('form-error');
    errEl.classList.add('hidden');
    const orderOpt = document.getElementById('order-select');
    const orderId = orderOpt.value;
    const sellerId = orderOpt.selectedOptions[0]?.dataset.seller;
    const text = document.getElementById('review-text').value.trim();
    if (!orderId || !sellerId) { errEl.textContent = 'Please select an order.'; errEl.classList.remove('hidden'); return; }
    if (selectedRating < 1) { errEl.textContent = 'Please select a rating.'; errEl.classList.remove('hidden'); return; }
    if (text.length < 5) { errEl.textContent = 'Review must be at least 5 characters.'; errEl.classList.remove('hidden'); return; }
    try {
      await apiFetch('/reviews', { method: 'POST', body: JSON.stringify({ sellerId, orderId, rating: selectedRating, text }) });
      showToast('Review submitted! Thanks 🙏');
      e.target.reset();
      selectedRating = 0;
      document.querySelectorAll('#star-picker button').forEach(b => b.textContent = '☆');
      loadReviews();
    } catch (err) { errEl.textContent = err.message; errEl.classList.remove('hidden'); }
  });

  function loadReviews() {
    apiFetch('/reviews').then(data => {
      const el = document.getElementById('reviews-list');
      const reviews = data.reviews || [];
      if (!reviews.length) { el.innerHTML = '<p class="text-stone-400 text-center py-8">No reviews yet — be the first!</p>'; return; }
      el.innerHTML = reviews.map(r => `
        <div class="bg-white p-6 rounded-xl shadow border border-stone-100">
          <div class="flex justify-between items-start mb-3">
            <div>
              <p class="font-bold">${r.shopName || 'Shop'}</p>
              <p class="text-sm text-stone-500">${r.authorName || (r.author?.name || 'Anonymous')}</p>
            </div>
            <div class="text-right">
              <p class="text-xl">${'⭐'.repeat(r.rating)}</p>
              <p class="text-xs text-stone-400">${new Date(r.createdAt).toLocaleDateString()}</p>
            </div>
          </div>
          <p class="text-stone-700">${r.text}</p>
        </div>`).join('');
    }).catch(() => {});
  }

  loadReviews();
</script>
</body>
</html>
