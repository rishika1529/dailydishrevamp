<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Dish | Purchase History</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>body{font-family:'Quicksand',sans-serif;background-color:#F8F7F2}.font-serif{font-family:'Playfair Display',serif}</style>
</head>
<body class="text-stone-800 flex flex-col min-h-screen">
<header class="bg-white/90 backdrop-blur-lg shadow-sm sticky top-0 z-50 border-b border-emerald-100">
  <div class="container mx-auto px-6 py-4 flex justify-between items-center">
    <a href="/" class="text-2xl font-bold text-emerald-600 flex items-center gap-3">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-emerald-500" viewBox="0 0 24 24" fill="currentColor"><path d="M22,9.333V8H2V9.333a9.998,9.998,0,0,0,2.158,6.334L4,22H20l-.158-6.333A9.998,9.998,0,0,0,22,9.333ZM12,2a8,8,0,0,0-8,8v.667h16V10A8,8,0,0,0,12,2Z"/></svg>
      <span class="font-serif">Daily Dish</span>
    </a>
    <nav class="hidden md:flex items-center gap-8">
      <a href="/buyer_dashboard.html" class="text-stone-600 hover:text-emerald-600">Deals</a>
      <a href="/savings.html" class="text-stone-600 hover:text-emerald-600">Savings</a>
      <a href="/purchase_history.html" class="text-emerald-600 font-semibold">History</a>
      <a href="/reviews.html" class="text-stone-600 hover:text-emerald-600">Reviews</a>
    </nav>
    <div class="flex items-center gap-4">
      <span class="text-sm text-stone-500">Hi, <strong data-user-name></strong></span>
      <button data-logout-btn class="px-4 py-2 text-sm text-white bg-red-500 rounded-full hover:bg-red-600 transition">Logout</button>
    </div>
  </div>
</header>

<main class="flex-grow py-10">
  <div class="container mx-auto px-6">
    <h1 class="text-4xl font-serif font-bold mb-8">Purchase History</h1>
    <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead class="bg-stone-50 text-left text-xs font-bold text-stone-500 uppercase tracking-wide">
            <tr>
              <th class="px-6 py-4">Item</th>
              <th class="px-6 py-4">Shop</th>
              <th class="px-6 py-4">Paid</th>
              <th class="px-6 py-4">Original</th>
              <th class="px-6 py-4">Saved</th>
              <th class="px-6 py-4">Qty</th>
              <th class="px-6 py-4">Status</th>
              <th class="px-6 py-4">OTP</th>
              <th class="px-6 py-4">Date</th>
            </tr>
          </thead>
          <tbody id="history-table" class="divide-y divide-stone-100">
            <tr><td colspan="9" class="px-6 py-8 text-center text-stone-400">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>
<footer class="text-center py-4 text-stone-500 text-sm bg-white border-t border-stone-200">© 2025 Daily Dish.</footer>
<script src="/api.js"></script>
<script>
  if (!requireAuth('buyer')) {}
  const statusColors = { reserved: 'bg-blue-100 text-blue-700', sold: 'bg-emerald-100 text-emerald-700', cancelled: 'bg-red-100 text-red-600' };
  apiFetch('/orders/my').then(data => {
    const tbody = document.getElementById('history-table');
    const orders = data.orders || [];
    if (!orders.length) {
      tbody.innerHTML = '<tr><td colspan="9" class="px-6 py-8 text-center text-stone-400">No purchases yet. Start browsing deals!</td></tr>';
      return;
    }
      tbody.innerHTML = orders.map(o => `
        <tr class="hover:bg-stone-50">
          <td class="px-6 py-4 font-semibold">${o.dealSnapshot.name}</td>
          <td class="px-6 py-4 text-stone-500">${o.dealSnapshot.shopName}</td>
          <td class="px-6 py-4 text-emerald-600 font-bold">₹${o.totalPaid}</td>
          <td class="px-6 py-4 text-stone-400 line-through">₹${o.totalOriginal}</td>
          <td class="px-6 py-4 text-green-600 font-bold">₹${o.totalOriginal - o.totalPaid}</td>
          <td class="px-6 py-4">${o.quantity}</td>
          <td class="px-6 py-4"><span class="px-2 py-1 rounded-full text-xs font-bold ${statusColors[o.status]}">${o.status === 'sold' ? 'completed' : o.status}</span></td>
          <td class="px-6 py-4">
            ${o.status === 'reserved'
              ? `<span class="font-mono text-sm font-bold text-emerald-600 bg-emerald-50 border border-emerald-200 px-2 py-1 rounded-lg tracking-wider">${o.pickupCode}</span>`
              : o.status === 'sold'
                ? '<span class="text-xs font-semibold text-emerald-600">✅ OTP Verified</span>'
                : '<span class="text-xs text-stone-400">—</span>'
            }
          </td>
          <td class="px-6 py-4 text-xs text-stone-400">${new Date(o.createdAt).toLocaleDateString()}</td>
        </tr>`).join('');
  }).catch(() => {
    document.getElementById('history-table').innerHTML = '<tr><td colspan="9" class="px-6 py-8 text-center text-red-400">Failed to load history.</td></tr>';
  });
</script>
</body>
</html>
